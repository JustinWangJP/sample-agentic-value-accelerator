# Registry ポータルの CI（テスト・Lint・型検査のみ）
#
# ADR-0004 に従い、AWS への反映は一切行わない。
# AWS の認証情報・OIDC ロール（id-token: write）はこのワークフローに持たせない。
name: registry-portal-ci

on:
  pull_request:
    paths:
      - "applications/registry_portal/**"
      - ".github/workflows/registry-portal-ci.yml"
      - ".pre-commit-config.yaml"
  push:
    branches: [main, develop]
    paths:
      - "applications/registry_portal/**"
      - ".github/workflows/registry-portal-ci.yml"
      - ".pre-commit-config.yaml"

permissions:
  contents: read

concurrency:
  group: registry-portal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend（pytest / Flake8 / Black / mypy）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/registry_portal/backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: applications/registry_portal/backend/requirements-dev.txt
      - name: 依存パッケージのインストール
        run: pip install -r requirements-dev.txt
      - name: pytest
        run: pytest
      - name: Flake8
        run: flake8 src tests ../scripts
      - name: Black
        run: black --config pyproject.toml --check src tests ../scripts
      - name: import 境界
        run: python ../scripts/check_imports.py
      - name: mypy
        run: mypy

  frontend:
    name: frontend（ESLint / Vitest / typecheck / build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/registry_portal/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: applications/registry_portal/frontend/package-lock.json
      - name: 依存パッケージのインストール
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Vitest
        run: npm test
      - name: typecheck
        run: npm run typecheck
      - name: build
        run: npm run build

  draft-iam:
    name: draft IAM（terraform fmt / validate）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/registry_portal/infrastructure
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - name: terraform fmt
        run: terraform fmt -check -recursive
      # ルートモジュール（management）の validate で、呼び出す下書きモジュールも検査する
      - name: terraform init
        working-directory: applications/registry_portal/infrastructure/management
        run: terraform init -backend=false
      - name: terraform validate
        working-directory: applications/registry_portal/infrastructure/management
        run: terraform validate
