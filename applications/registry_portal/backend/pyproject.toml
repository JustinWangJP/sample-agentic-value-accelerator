[project]
name = "registry-portal-backend"
version = "0.1.0"
description = "AWS Agent Registry 管理ポータル（Registry ポータル）のバックエンド"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
# ../scripts は運用スクリプト（検証スクリプトなど）をテストから import するため
pythonpath = ["src", "../scripts"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
# 運用スクリプトのうち、registry_portal の定義を使う検証スクリプトも strict で検査する
files = ["src/registry_portal", "../scripts/verify_suspend_dual_revision.py"]
strict = true
