[project]
name = "registry-portal-backend"
version = "0.1.0"
description = "AWS Agent Registry 管理ポータル（Registry ポータル）のバックエンド"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["registry_portal"]
strict = true
