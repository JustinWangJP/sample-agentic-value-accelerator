openapi: 3.1.0
info:
  title: Registry ポータル API
  version: 0.2.0
  summary: AWS Agent Registry 管理ポータル（Registry ポータル）のバックエンド API
  description: |
    AWS Agent Registry を唯一の正本として、Agent・MCP サーバー・Skill の登録、公開承認、発見を扱う
    管理ポータルの API です。この文書は `backend/src/registry_portal/` の実装から書き起こした
    リバース仕様で、実装（`app.py` のルート表）と README の契約に従います。

    ## 構成

    API Gateway REST API（REGIONAL、ステージ `v1`）のメソッドを、Lambda プロキシ統合（`AWS_PROXY`）で
    2つの Lambda handler に割り当てます（ADR-0015）。メソッドは共通の経路表
    （`infrastructure/modules/api_routes/routes.json`）から作り、この文書の operation と一致させます。
    各 operation の `x-handler` が担当する handler を示します。

    HTTP API からの移行中（#77 まで）は、handler が HTTP API（payload format 2.0）のイベントも受け付けます。
    配信する API は REST API だけです。

    | `x-handler` | Lambda エントリーポイント | 担当 |
    | --- | --- | --- |
    | `management` | `handlers/management.py` | 自分の情報、カタログ、下書き・申請、操作照会、履歴、廃止依頼、通知、Admin の一覧・接続診断 |
    | `curation` | `handlers/curation.py` | 審査・決裁、公開停止・廃止、公開管理、廃止依頼の見送り、回復操作、取り込み・所有変更 |

    イベント処理 handler（`handlers/events.py`）は EventBridge から呼ばれ、API Gateway の経路を持たないため対象外です。

    ## 認証と認可

    すべての API に、Cognito User Pool が人間用 SPA client へ発行したアクセストークンが必要です。
    REST API の Cognito User Pools authorizer がトークンを検証し、各メソッドの authorization scope
    `registry-portal/api.invoke` を要求します。Lambda は claims（`token_use=access`、`iss`、`client_id`、`sub`）を
    再検査します。業務ロールは Cognito グループから導出します。

    | Cognito グループ | 業務ロール |
    | --- | --- |
    | （なし。ログインした全員） | `Viewer` |
    | `registry-publisher` | `Publisher` |
    | `registry-curator` | `Curator` |
    | `registry-admin` | `Admin` |
    | `team-*` | 所属チーム |

    - 認証できないトークン（なし、ID トークン、別 issuer、`sub` なし）は 401 `UNAUTHENTICATED`。
    - 署名は正しいが人間用 SPA client 以外に発行されたトークン（別 client、発見用 M2M client）は 403 `FORBIDDEN`。
    ## API Gateway が返す応答

    次の応答は Lambda に届く前に API Gateway が返します。本文は共通エラー DTO ではありません（`GatewayErrorResponse`）。

    - 401: Cognito User Pools authorizer がトークンを拒否した（トークンがない、無効、期限切れなど）。
    - 403: 接続元 IP が許可範囲（本体スタックの変数 `allowed_source_cidrs`）の外にあり、REST API のリソースポリシーが拒否した。
      トークンがない場合は authorizer の 401 が先に返ります。
    - 429: ステージのスロットリング（10 rps、バースト 20）を超えた。

    ## CORS

    REST API の応答は、リクエストの `Origin` が許可リスト（CloudFront の SPA の origin と、本体スタックの変数
    `local_dev_origins`）に含まれるときだけ `Access-Control-Allow-Origin` にその値を返し、`Vary: Origin` を付けます。

    - 各パスの `OPTIONS`（プリフライト）は authorizer を通さずに管理 Lambda が 204 で応答します。許可した origin には
      `Access-Control-Allow-Methods: GET, POST, PATCH, OPTIONS`、`Access-Control-Allow-Headers: Authorization, Content-Type, Idempotency-Key`、
      `Access-Control-Max-Age: 300` を返します。`OPTIONS` は operation としては記載しません。
    - API Gateway が返す 4XX・5XX は、`Origin` を許可リストと照合せずに `Access-Control-Allow-Origin` へそのまま返します。
      gateway response では照合できないためです。`Access-Control-Allow-Credentials` は付けません（ADR-0015）。
    - 接続元 IP の制限は `OPTIONS` にも適用されます。

    ## 共通の約束

    - 応答はすべて `application/json; charset=utf-8` で、`cache-control: no-store` を付けます。
    - エラーは共通エラー DTO（`ErrorResponse`）で返します。AWS や内部の例外メッセージはそのまま返しません。
    - ルート表にない method と path の組は 404 `NOT_FOUND` です。
    - リクエスト本文は JSON オブジェクトに限ります。operation ごとに本文の文字数上限があり、超えると 400 `VALIDATION_ERROR` です。
    - リクエスト本文の未知の項目は 400 `VALIDATION_ERROR` です（`additionalProperties: false`）。応答には今後項目が増えることがあるため、
      クライアントは未知の項目を無視してください。
    - 書き込み操作の多くは、AWS の結果が確定するまで 202 `VERIFYING`（結果確認中）を返します。
      `GET /api/operations/{operationId}` で照合するか、同じ `Idempotency-Key` で再送して確定します。
    - 下書きの作成・申請と決裁は、AWS への書き込みが処理されなかったと確定した場合に、200 で
      `operationState: FAILED` の `OperationStatus` を返すことがあります。
  contact:
    name: Registry ポータルの Issue
    url: https://github.com/JustinWangJP/sample-agentic-value-accelerator/issues
  license:
    name: MIT-0
    identifier: MIT-0
servers:
  - url: https://{apiId}.execute-api.{region}.amazonaws.com/v1
    description: 本体スタックが作る API Gateway REST API のステージ `v1`（本体の output `frontend_config` の `VITE_API_BASE_URL`）。
    variables:
      apiId:
        default: example
        description: REST API の ID（本体の output `rest_api` の `id`）
      region:
        default: us-east-1
        description: REST API のリージョン
security:
  - bearerAuth: []
tags:
  - name: me
    description: 自分の主体・業務ロール・所属チーム
  - name: catalog
    description: カタログ（公開承認済みの Registry レコード）の一覧・検索・詳細。ログインした全員（Viewer）が使えます。
  - name: drafts
    description: 下書きの作成・取得・一覧・編集・申請（Publisher）
  - name: operations
    description: 書き込み操作の結果の照会
  - name: history
    description: 操作と審査の履歴
  - name: deprecation-requests
    description: 廃止依頼（Publisher）と見送り（Curator）
  - name: reviews
    description: 審査待ちの一覧・詳細と決裁（Curator）
  - name: publication
    description: 公開停止・廃止・公開管理の照会・管理レコードの検索（Curator）
  - name: recovery
    description: 結果確認中のまま止まった操作の回復（Admin）
  - name: administration
    description: 既存レコードの取り込み・所有変更・接続診断（Admin）
  - name: notifications
    description: 画面上の通知

paths:
  /api/me:
    get:
      operationId: getMe
      tags: [me]
      summary: 自分の主体・業務ロール・所属チームを取得する
      description: |
        検証済みの claims から導出した主体（`iss` と `sub`）、業務ロール、所属チームを返します。
        業務ロールは Cognito グループから導出し、ログインした全員が `Viewer` を持ちます。
      x-handler: management
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/catalog:
    get:
      operationId: listCatalog
      tags: [catalog]
      summary: カタログ項目を種別ごとに1ページ取得する
      description: |
        公開承認済みの Registry レコードを、種別ごとに1ページ（最大50件）返します。ポータルは発見用 M2M トークンで
        Registry の `ListDiscoverableRegistryRecords` を代理で呼び出します。AWS はページが疎であることを保証しないため、
        `items` が0件でも `nextToken` があれば次のページがあり得ます。
      x-handler: management
      parameters:
        - name: type
          in: query
          required: true
          description: 種別
          schema:
            $ref: "#/components/schemas/CatalogRecordType"
        - name: a2a
          in: query
          required: false
          description: "`true` で A2A の Agent（descriptor が `a2aAgentCard`）だけに絞ります。`type=AGENT` のときだけ指定でき、`true` 以外の値は 400 です。"
          schema:
            type: string
            enum: ["true"]
        - $ref: "#/components/parameters/CatalogNextTokenParam"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogListResponse"
        "400":
          description: |
            クエリの誤り。
            - `VALIDATION_ERROR`: 未知のクエリ、`type` の誤り、`a2a` の誤り
            - `INVALID_PAGE_TOKEN`: `nextToken` の形式の誤り、または Registry が token を拒否した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/DiscoveryUnavailable"

  /api/catalog/search:
    post:
      operationId: searchCatalog
      tags: [catalog]
      summary: カタログを検索する
      description: |
        自然言語・キーワード（必須）と絞り込み条件で検索し、関連度順に最大20件を返します（`SearchDiscoverableRegistryRecords`）。
        検索語のない「条件だけの検索」はできません。条件だけで探す場合は `GET /api/catalog` を使います。
        クエリパラメーターを指定すると 400 です。本文は8,192文字までです。

        A2A 検索で、検索用の写し（`isA2A`）と descriptor が食い違うレコードは結果から除き、その件数を
        `inconsistentA2ACount` で返します。
      x-handler: management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogSearchRequest"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSearchResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/DiscoveryUnavailable"
        "503":
          description: "`A2A_SEARCH_NOT_READY`: A2A 検索は準備中（環境変数 `A2A_SEARCH_ENABLED` が無効）で、`a2a` を指定した検索を受け付けない"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/catalog/{recordId}:
    parameters:
      - $ref: "#/components/parameters/RecordIdParam"
    get:
      operationId: getCatalogItem
      tags: [catalog]
      summary: カタログ項目の詳細を取得する
      description: |
        指定したレコード ID の公開中の版、所有チーム、その版の連絡先・利用条件・接続先の参照・関連参照を返します。
        クエリパラメーターを指定すると 400 です。
      x-handler: management
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`CATALOG_ITEM_NOT_FOUND`: 公開承認済みの版が見つからない"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/DiscoveryUnavailable"

  /api/records:
    post:
      operationId: createRecordDraft
      tags: [drafts]
      summary: 下書きを作成する
      description: |
        所属チームを所有チームに指定して、下書き（Registry レコード）を作成します。`Publisher` で、`ownerTeam` を
        所属チームに持つ呼び出し元だけが実行できます。本文は262,144文字までです。

        同じ主体・`Idempotency-Key`・本文は同じ結果を返します。同じキーに異なる本文は 409 です。
        失敗が確定した後は、新しいキーで作成し直してください。
      x-handler: management
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordDraftInput"
      responses:
        "201":
          description: 作成が確定した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftResult"
        "200":
          description: AWS が作成に失敗した（`CREATE_FAILED` を確認した）。`operationState` は `FAILED`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationStatus"
        "202":
          $ref: "#/components/responses/OperationVerifying"
        "400":
          $ref: "#/components/responses/DraftValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ContentConflict"
        "429":
          $ref: "#/components/responses/RegistryThrottled"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/RegistryUnavailable"
        "503":
          $ref: "#/components/responses/DraftsNotConfigured"
    get:
      operationId: listRecordDrafts
      tags: [drafts]
      summary: 所属チームの管理レコードを一覧する
      description: |
        所属チームが所有する管理レコード（`AGENT`・`MCP`・`SKILL`）を一覧します。AWS の `ListRegistryRecords`（20件）の
        `nextToken` をそのまま中継し、所有チームの絞り込みはポータル側で行うため、`items` が0件でも次のページがあり得ます。
      x-handler: management
      parameters:
        - $ref: "#/components/parameters/NextTokenParam"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/RegistryUnavailable"
        "503":
          $ref: "#/components/responses/DraftsNotConfigured"

  /api/records/{recordId}:
    parameters:
      - $ref: "#/components/parameters/RecordIdParam"
    get:
      operationId: getRecordDraft
      tags: [drafts]
      summary: 下書きを取得する
      description: |
        下書きのフォーム入力、内容ハッシュ（`contentHash`）、AWS の状態、公開中の版を返します。所属チームが所有する
        管理レコードだけを取得できます。未管理レコードと他チームのレコードは 403 です。
      x-handler: management
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftView"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/RegistryUnavailable"
        "503":
          $ref: "#/components/responses/DraftsNotConfigured"
    patch:
      operationId: updateRecordDraft
      tags: [drafts]
      summary: 下書きを編集する
      description: |
        取得した内容ハッシュを添えて下書きを保存します。所有チーム・`name`・種別（`recordType`）は変更できません
        （Agent だけは `custom` と `a2aAgentCard` の descriptor を切り替えられます）。本文は262,144文字までです。

        内容ハッシュが一致しない、別の操作が処理中、または AWS の状態が `CREATING`・`UPDATING`・`DEPRECATED` なら 409 です。
        この API は `Idempotency-Key` を使いません。結果不明の更新は再送せず、操作照会で確定します。
      x-handler: management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDraftRequest"
      responses:
        "200":
          description: |
            更新が確定した（`DraftResult`）、または AWS が更新に失敗した・更新が AWS に届かなかったと確定した
            （`OperationStatus`、`operationState: FAILED`）
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DraftResult"
                  - $ref: "#/components/schemas/OperationStatus"
        "202":
          $ref: "#/components/responses/OperationVerifying"
        "400":
          $ref: "#/components/responses/DraftValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`FORBIDDEN`: Publisher でない、所属チームがない、他チームまたは未管理のレコード、所有チームを変更しようとした"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/ContentConflict"
        "429":
          $ref: "#/components/responses/RegistryThrottled"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/RegistryUnavailable"
        "503":
          $ref: "#/components/responses/DraftsNotConfigured"

  /api/records/{recordId}/submit:
    parameters:
      - $ref: "#/components/parameters/RecordIdParam"
    post:
      operationId: submitRecordDraft
      tags: [drafts]
      summary: 下書きを申請する
      description: |
        所属チームが所有する保存済みの `DRAFT` を申請します。申請は下書きの保存を兼ねません。本文は16,384文字までです。

        - AWS の状態が `DRAFT` でない、または内容ハッシュが一致しなければ 409 です。
        - `recordVersion` は公開中の版より大きい semver である必要があります。
        - 関連参照は Agent だけが指定でき、参照先は公開承認済みの Skill または MCP サーバーに限ります。MCP・Skill は空の配列を指定します。
        - Registry に自動承認の規則があれば、AWS に書き込まずに 503 `APPROVAL_CONFIGURATION_CHANGED` で止めます。

        同じキーの再送は、先の操作の結果（照合を含む）を返します。同じキーに異なる本文は 409 です。
      x-handler: management
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitDraftRequest"
      responses:
        "200":
          description: |
            申請が確定した（`SubmissionResult`）、または申請が成立しなかったと確定した（`OperationStatus`、`operationState: FAILED`）
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SubmissionResult"
                  - $ref: "#/components/schemas/OperationStatus"
        "202":
          $ref: "#/components/responses/OperationVerifying"
        "400":
          $ref: "#/components/responses/DraftValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ContentConflict"
        "429":
          $ref: "#/components/responses/RegistryThrottled"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/RegistryUnavailable"
        "503":
          description: |
            - `DRAFTS_NOT_CONFIGURED`: 補助テーブル（`SUPPLEMENT_TABLE_NAME`）が未設定
            - `APPROVAL_CONFIGURATION_CHANGED`: Registry の自動承認設定が想定外（有効または取得できない）。AWS へは書き込んでいない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/records/{recordId}/history:
    parameters:
      - $ref: "#/components/parameters/RecordIdParam"
    get:
      operationId: getRecordHistory
      tags: [history]
      summary: 操作と審査の履歴を取得する
      description: |
        レコードごとの操作と審査の履歴を、開始時刻の順に返します。`Curator` と `Admin` はすべてのレコード、`Publisher` は
        所属チームが所有するレコードだけを読めます。`Viewer` だけの利用者は 403 です。

        結果確認中の決裁（公開承認・却下・公開停止・廃止）は、決裁した Curator 本人以外には中身を伏せて返します
        （`withheld: true`、`operationId` と `targetHash` は `null`）。取り込み前から公開されていた版には、主体が不明な
        公開承認の項目（`state: UNKNOWN`、`principal: null`）を先頭に返します。
      x-handler: management
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
